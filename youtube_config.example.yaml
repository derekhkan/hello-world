# YouTube Automation Agent Configuration
# Copy this file to youtube_config.yaml and fill in your values.
# NEVER commit youtube_config.yaml — it contains secrets.

account:
  # OAuth2 client secrets file (download from Google Cloud Console)
  client_secrets_file: "client_secrets.json"
  # Optional: API key for read-only operations (no OAuth required)
  api_key: ""  # or set YOUTUBE_API_KEY env var

# ---------------------------------------------------------------------------
# Content publishing
# ---------------------------------------------------------------------------
content:
  media_dir: "./media"

  # Posting schedule (24-hour format, machine timezone)
  schedule:
    videos:
      enabled: true
      times: ["10:00", "16:00"]
    shorts:
      enabled: true
      times: ["12:00", "18:00"]
    community:
      enabled: true
      times: ["14:00"]

  # Default video settings
  default_tags:
    - "motivation"
    - "discipline"
    - "selfimprovement"
  category_id: "22"  # People & Blogs
  privacy: "public"   # public, unlisted, or private

# ---------------------------------------------------------------------------
# Content generation — auto-create thumbnails and media
# ---------------------------------------------------------------------------
generation:
  enabled: true

  quotes:
    - "Subscribe for more content like this."
    - "This changed everything for me."
    - "Stop scrolling. This is important."

  ai:
    enabled: false
    gemini_api_key: ""       # or set GEMINI_API_KEY env var
    openai_api_key: ""       # or set OPENAI_API_KEY env var
    prompts:
      - "A dramatic thumbnail background with bold text overlay"

# ---------------------------------------------------------------------------
# Engagement — interact with other channels
# ---------------------------------------------------------------------------
engagement:
  enabled: true

  target_channels:
    - "UC_channel_id_1"
    - "UC_channel_id_2"

  discovery_keywords:
    - "self improvement"
    - "productivity"
    - "fitness motivation"

  likes_per_channel: 3

  commenting:
    enabled: true
    templates:
      - "Great video! Really enjoyed this perspective."
      - "This is incredibly insightful. Subscribed!"
      - "Exactly what I needed to hear today. Keep it up!"

  delay:
    min_seconds: 30
    max_seconds: 90

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"
  file: "youtube_agent.log"
